<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интернет. Поиск информации. Безопасность в сети — Рабочий лист</title>
<style>
  :root{
    --bg:#f7f7f8;
    --surface:#ffffff;
    --surface-2:#fbfbfc;
    --border:#e5e7eb;
    --border-strong:#d4d4d8;
    --text:#18181b;
    --text-muted:#71717a;
    --text-soft:#52525b;
    --accent:#0a84ff;
    --accent-soft:#dbeafe;
    --accent-dark:#0066d6;
    --success:#16a34a;
    --success-soft:#dcfce7;
    --danger:#dc2626;
    --danger-soft:#fee2e2;
    --warn:#d97706;
    --warn-soft:#fef3c7;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.05);
    --shadow:0 4px 12px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
    --radius:14px;
    --radius-lg:18px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    font-size:16px;
    line-height:1.55;
    min-height:100vh;
  }
  button{font-family:inherit}
  .app{max-width:860px;margin:0 auto;padding:24px 20px 80px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--text);font-size:14px}
  .brand-dot{
    width:28px;height:28px;border-radius:8px;
    background:linear-gradient(135deg,#0a84ff,#60a5fa);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;
    box-shadow:var(--shadow-sm);
  }
  .progress-wrap{
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:6px 14px;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--text-soft);box-shadow:var(--shadow-sm);
  }
  .progress-bar{width:120px;height:6px;border-radius:999px;background:#eef2f7;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#0a84ff,#38bdf8);width:0%;transition:width .4s ease}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:28px;
    box-shadow:var(--shadow);animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .chip{
    display:inline-block;font-size:12px;font-weight:600;
    color:var(--accent-dark);background:var(--accent-soft);
    padding:4px 10px;border-radius:999px;letter-spacing:.2px;margin-bottom:10px;
  }
  h1{font-size:26px;line-height:1.25;margin:4px 0 8px;letter-spacing:-.01em;font-weight:700}
  h2{font-size:20px;margin:0 0 6px;letter-spacing:-.01em;font-weight:650}
  h3{font-size:16px;margin:0 0 8px;font-weight:600}
  .lead{color:var(--text-soft);font-size:15px;margin:0 0 18px}
  .muted{color:var(--text-muted);font-size:14px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid transparent;border-radius:12px;
    padding:12px 18px;font-size:15px;font-weight:600;
    cursor:pointer;min-height:44px;
    transition:transform .08s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease;
    user-select:none;
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}
  .btn-primary{
    background:var(--accent);color:#fff;
    box-shadow:0 1px 2px rgba(10,132,255,.3), 0 4px 12px rgba(10,132,255,.18);
  }
  .btn-primary:hover{background:var(--accent-dark)}
  .btn-ghost{background:transparent;color:var(--text-soft);border-color:var(--border-strong)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:24px}
  .input, textarea{
    width:100%;border:1px solid var(--border-strong);border-radius:12px;
    padding:12px 14px;font-size:15px;font-family:inherit;
    background:var(--surface);color:var(--text);
    transition:border-color .2s, box-shadow .2s;min-height:44px;
  }
  .input:focus, textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.15)}
  .field-label{display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .option{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 16px;border:1px solid var(--border);border-radius:12px;
    background:var(--surface);cursor:pointer;
    transition:border-color .15s, background .15s, transform .08s;min-height:44px;
  }
  .option:hover{border-color:var(--border-strong);background:var(--surface-2)}
  .option:active{transform:translateY(1px)}
  .option.selected{border-color:var(--accent);background:var(--accent-soft)}
  .option.correct{border-color:var(--success);background:var(--success-soft)}
  .option.wrong{border-color:var(--danger);background:var(--danger-soft)}
  .option .dot{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;
    border:2px solid var(--border-strong);margin-top:2px;
    display:grid;place-items:center;transition:all .15s;
  }
  .option.selected .dot{border-color:var(--accent);background:var(--accent)}
  .option.selected .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
  .option .check{
    flex:0 0 auto;width:20px;height:20px;border-radius:6px;
    border:2px solid var(--border-strong);margin-top:2px;
    display:grid;place-items:center;transition:all .15s;
  }
  .option.selected .check{border-color:var(--accent);background:var(--accent)}
  .option.selected .check::after{
    content:"";width:10px;height:10px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='white' d='M6.5 11.5 3 8l1-1 2.5 2.5L12 4l1 1z'/></svg>") center/contain no-repeat;
  }
  .option.correct .check, .option.correct .dot{border-color:var(--success);background:var(--success)}
  .option.wrong .check, .option.wrong .dot{border-color:var(--danger);background:var(--danger)}
  .option-text{font-size:15px;color:var(--text)}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .match-col{display:flex;flex-direction:column;gap:10px}
  .match-item{
    padding:12px 14px;border:1px solid var(--border);border-radius:12px;
    background:var(--surface);cursor:pointer;font-size:14px;
    transition:all .15s;min-height:44px;display:flex;align-items:center;
  }
  .match-item:hover{border-color:var(--border-strong);background:var(--surface-2)}
  .match-item.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
  .match-item.paired{border-color:var(--accent);background:var(--accent-soft)}
  .match-item.correct{border-color:var(--success);background:var(--success-soft)}
  .match-item.wrong{border-color:var(--danger);background:var(--danger-soft)}
  .fill-text{
    font-size:15px;line-height:2.2;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;padding:18px;margin-top:12px;
  }
  .blank-input{
    display:inline-block;min-width:120px;
    border:none;border-bottom:2px dashed var(--border-strong);
    background:transparent;font-size:15px;font-family:inherit;
    padding:2px 6px;color:var(--text);text-align:center;transition:all .15s;
  }
  .blank-input:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-soft);border-radius:4px}
  .blank-input.correct{border-bottom-color:var(--success);background:var(--success-soft);border-bottom-style:solid}
  .blank-input.wrong{border-bottom-color:var(--danger);background:var(--danger-soft);border-bottom-style:solid}
  .url-builder{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
  .url-result{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:14px;
    padding:12px 14px;background:#fff;border:1px dashed var(--border-strong);
    border-radius:10px;min-height:44px;word-break:break-all;color:var(--text);
  }
  .url-result.empty{color:var(--text-muted);font-style:italic}
  .fragments{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .fragment{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:13px;
    padding:8px 12px;background:#fff;border:1px solid var(--border-strong);
    border-radius:8px;cursor:pointer;transition:all .15s;min-height:36px;
    display:inline-flex;align-items:center;
  }
  .fragment:hover{border-color:var(--accent);background:var(--accent-soft)}
  .fragment.in-result{background:var(--accent-soft);border-color:var(--accent);cursor:pointer}
  .fragment.in-result:hover{background:var(--danger-soft);border-color:var(--danger)}
  .url-hint{font-size:13px;color:var(--text-muted);margin-top:8px}
  .feedback{
    margin-top:16px;padding:12px 14px;border-radius:10px;
    font-size:14px;display:none;animation:fadeIn .25s ease;
  }
  .feedback.show{display:block}
  .feedback.ok{background:var(--success-soft);color:#15803d;border:1px solid #bbf7d0}
  .feedback.err{background:var(--danger-soft);color:#b91c1c;border:1px solid #fecaca}
  .feedback.info{background:var(--accent-soft);color:var(--accent-dark);border:1px solid #bfdbfe}
  .hero{text-align:center;padding:20px 10px 10px}
  .hero-icon{
    width:72px;height:72px;border-radius:20px;
    background:linear-gradient(135deg,#0a84ff,#60a5fa);
    display:grid;place-items:center;margin:0 auto 18px;
    box-shadow:0 10px 24px rgba(10,132,255,.25);
  }
  .hero-icon svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2}
  .hero h1{font-size:28px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 22px}
  .meta-pill{
    font-size:12px;padding:6px 12px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;color:var(--text-soft);
  }
  .start-form{max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .score-card{text-align:center;padding:20px 10px}
  .score-ring{width:160px;height:160px;margin:10px auto 20px;position:relative}
  .score-ring svg{transform:rotate(-90deg);width:100%;height:100%}
  .score-ring circle{fill:none;stroke-width:12;stroke-linecap:round}
  .score-ring .bg{stroke:#eef2f7}
  .score-ring .fg{stroke:var(--accent);transition:stroke-dashoffset 1s ease}
  .score-ring .label{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:38px;font-weight:700;color:var(--text);
  }
  .score-ring .label small{font-size:14px;color:var(--text-muted);font-weight:500;display:block;margin-top:-4px}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
  .stat .n{font-size:22px;font-weight:700;color:var(--text)}
  .stat .t{font-size:12px;color:var(--text-muted);margin-top:2px}
  .q-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .q-num{font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase}
  .q-type{font-size:11px;color:var(--text-muted);padding:3px 8px;border:1px solid var(--border);border-radius:999px}
  @media (max-width:520px){
    .app{padding:16px 14px 60px}
    .card{padding:20px}
    h1{font-size:22px}
    h2{font-size:18px}
    .progress-bar{width:80px}
    .match-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   КОНСТАНТЫ: 10 заданий в трёх блоках
   ============================================================ */
const QUESTIONS = [
  /* ================= БЛОК 1 · ПОВТОРЕНИЕ ================= */
  {
    id:'q1', type:'single', block:'Блок 1 · Повторение',
    title:'Клиенты и серверы',
    text:'Что из перечисленного является примером клиента в сети Интернет?',
    options:[
      'Металлический ящик в серверном шкафу без монитора',
      'Твой смартфон с сенсорным экраном',
      'Мощный компьютер с сотнями гигабайт оперативной памяти в дата-центре',
      'Оптоволоконный кабель на дне океана'
    ],
    correct:1,
    explain:'Клиент — это устройство пользователя: телефон, планшет, ноутбук. У него есть экран и клавиатура.'
  },
  {
    id:'q2', type:'match', block:'Блок 1 · Повторение',
    title:'Виды подключения к Интернету',
    text:'Соедини вид связи с его описанием.',
    left:[
      {id:'a', text:'DSL'},
      {id:'b', text:'Коаксиальный кабель'},
      {id:'c', text:'Оптоволокно'},
      {id:'d', text:'Спутниковая связь'}
    ],
    right:[
      {id:'1', text:'Передача света через стекло или пластик — самый быстрый способ'},
      {id:'2', text:'Медные линии — цифровая абонентская линия'},
      {id:'3', text:'Используется в труднодоступных местах, например в горах'},
      {id:'4', text:'Медная жила и экран — быстрее, чем DSL'}
    ],
    pairs:{a:'2', b:'4', c:'1', d:'3'},
    explain:'DSL — медные линии, коаксиальный — быстрее DSL, оптоволокно — свет и самое быстрое, спутник — для труднодоступных мест.'
  },
  {
    id:'q3', type:'url', block:'Блок 1 · Повторение',
    title:'Задание ВПР №4 (а)',
    text:'Доступ к файлу water.txt на сервере river.kz по протоколу https. Собери адрес из фрагментов, нажимая на них по порядку.',
    fragments:[
      {id:1, text:'water.'},
      {id:2, text:'://'},
      {id:3, text:'txt'},
      {id:4, text:'.kz'},
      {id:5, text:'https'},
      {id:6, text:'river'},
      {id:7, text:'/'}
    ],
    correct:[5,2,6,4,7,1,3],
    explain:'Правильный адрес: https://river.kz/water.txt → последовательность 5264713.'
  },

  /* ================= БЛОК 2 · ИЗУЧЕНИЕ НОВОГО ================= */
  {
    id:'q4', type:'multi', block:'Блок 2 · Изучение нового',
    title:'Сетевой этикет',
    text:'Какие правила относятся к сетевому этикету? (выбери все верные)',
    options:[
      'Писать сообщения ЗАГЛАВНЫМИ БУКВАМИ, чтобы тебя услышали',
      'Не переходить на личности в споре, избегать оскорблений',
      'Не публиковать чужие личные данные без разрешения',
      'Следить за грамотностью и оформлением сообщений'
    ],
    correct:[1,2,3],
    explain:'CAPS LOCK в сети воспринимается как крик — это неэтично. Вежливость, конфиденциальность и грамотность — основные правила общения в сети.'
  },
  {
    id:'q5', type:'match', block:'Блок 2 · Изучение нового',
    title:'Угрозы в сети',
    text:'Соедини вид угрозы с его описанием.',
    left:[
      {id:'a', text:'Вирус'},
      {id:'b', text:'Фишинг'},
      {id:'c', text:'Кибербуллинг'},
      {id:'d', text:'Утечка данных'}
    ],
    right:[
      {id:'1', text:'Травля и оскорбления человека в сети'},
      {id:'2', text:'Мошенничество: поддельные сайты и письма для кражи паролей'},
      {id:'3', text:'Вредоносная программа, которая повреждает файлы и системы'},
      {id:'4', text:'Несанкционированный доступ к личной информации и её раскрытие'}
    ],
    pairs:{a:'3', b:'2', c:'1', d:'4'},
    explain:'Вирус — вредоносная программа, фишинг — обман для кражи данных, кибербуллинг — травля, утечка данных — раскрытие информации без разрешения.'
  },
  {
    id:'q6', type:'single', block:'Блок 2 · Изучение нового',
    title:'Что такое фишинг?',
    text:'Выбери правильное определение.',
    options:[
      'Антивирусная программа для защиты компьютера',
      'Способ быстрого подключения к Интернету',
      'Вид компьютерной онлайн-игры',
      'Вид интернет-мошенничества: поддельные сайты и письма, чтобы получить личные данные пользователя'
    ],
    correct:3,
    explain:'Фишинг (от fishing — «рыбалка») — это когда мошенники «ловят» личные данные пользователей через поддельные сайты, письма и сообщения.'
  },
  {
    id:'q7', type:'tf', block:'Блок 2 · Изучение нового',
    title:'Информационная безопасность',
    text:'Отметь, какие утверждения верные, а какие — нет.',
    statements:[
      {text:'Информационная безопасность — это только защита компьютера от вирусов.', correct:false},
      {text:'Сложные пароли помогают защищать личные данные от несанкционированного доступа.', correct:true},
      {text:'Если подозрительная ссылка пришла от знакомого, её можно смело открывать.', correct:false},
      {text:'Проверять достоверность информации — одно из правил безопасности в сети.', correct:true}
    ],
    explain:'Информационная безопасность — это защита от несанкционированного доступа, использования, раскрытия, изменения или уничтожения информации. Ссылки от знакомых тоже могут быть взломаны — будь внимателен.'
  },

  /* ================= БЛОК 3 · ЗАКРЕПЛЕНИЕ ================= */
  {
    id:'q8', type:'fill', block:'Блок 3 · Закрепление',
    title:'Ключевые понятия',
    text:'Заполни пропуски подходящими по смыслу словами.',
    segments:[
      {t:'text', v:'У каждого устройства в сети есть свой уникальный '},
      {t:'blank', a:'ip-адрес', hint:'адрес в сети (2 слова через дефис)'},
      {t:'text', v:' — цифровой паспорт компьютера. Программы, с помощью которых мы путешествуем по Всемирной паутине, называются '},
      {t:'blank', a:'браузеры', hint:'Chrome, Яндекс, Firefox — это…'},
      {t:'text', v.'. А защита информации от несанкционированного доступа, использования, раскрытия, изменения или уничтожения — это '},
      {t:'blank', a:'информационная безопасность', hint:'два слова'},
      {t:'text', v:'.'}
    ],
    explain:'IP-адрес — уникальный адрес устройства. Браузеры — программы для работы с веб-страницами. Информационная безопасность — защита информации от несанкционированного доступа и других угроз.'
  },
  {
    id:'q9', type:'multi', block:'Блок 3 · Закрепление',
    title:'Правила безопасности в сети',
    text:'Выбери все правильные правила безопасного поведения в сети.',
    options:[
      'Переходить по всем интересным ссылкам, которые попадаются',
      'Не сообщать личные данные незнакомцам в сети',
      'Использовать везде один простой пароль, чтобы не забыть',
      'Проверять достоверность информации перед тем, как ей доверять',
      'Использовать сложные пароли для разных аккаунтов'
    ],
    correct:[1,3,4],
    explain:'Нельзя переходить по всем ссылкам подряд и использовать один простой пароль везде. Нужно защищать личные данные, проверять информацию и использовать сложные разные пароли.'
  },
  {
    id:'q10', type:'url', block:'Блок 3 · Закрепление',
    title:'Задание ВПР №4 (б)',
    text:'Доступ к файлу pas.cpp на сервере com.edu по протоколу ftp. Собери адрес из фрагментов.',
    fragments:[
      {id:1, text:'com'},
      {id:2, text:'.edu'},
      {id:3, text:'pas'},
      {id:4, text:'.cpp'},
      {id:5, text:'/'},
      {id:6, text:'://'},
      {id:7, text:'ftp'}
    ],
    correct:[7,6,1,2,5,3,4],
    explain:'Правильный адрес: ftp://com.edu/pas.cpp → последовательность 7612534.'
  }
];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  screen:'start',
  studentName:'',
  current:0,
  answers:{},
  checked:{},
  matchState:{}
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return document.querySelectorAll(sel); }
function app(){ return document.getElementById('app'); }

function norm(s){
  return (s||'').trim().toLowerCase().replace(/ё/g,'е');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  if(state.screen === 'start') return renderStart();
  if(state.screen === 'quiz')  return renderQuiz();
  if(state.screen === 'result') return renderResult();
}

/* --- Стартовый экран --- */
function renderStart(){
  app().innerHTML = `
    <div class="app">
      <div class="card">
        <div class="hero">
          <div class="hero-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          </div>
          <span class="chip">Информатика · 7 класс</span>
          <h1>Интернет. Поиск информации.<br>Безопасность в сети</h1>
          <p class="lead">Интерактивный рабочий лист: повторение теории, изучение правил безопасности и сетевого этикета, закрепление в формате ВПР.</p>
          <div class="meta-row">
            <span class="meta-pill">10 заданий</span>
            <span class="meta-pill">3 блока</span>
            <span class="meta-pill">~25 минут</span>
            <span class="meta-pill">Самопроверка</span>
          </div>
        </div>
        <div class="start-form">
          <div>
            <label class="field-label" for="name">Как тебя зовут?</label>
            <input class="input" id="name" type="text" placeholder="Например, Анна" autocomplete="given-name" maxlength="40">
          </div>
          <button class="btn btn-primary" id="startBtn" type="button" style="width:100%">Начать →</button>
          <p class="muted" style="text-align:center;font-size:13px">Ответы сохраняются, пока ты не обновишь страницу.</p>
        </div>
      </div>
    </div>
  `;
  const nameInput = $('#name');
  const startBtn = $('#startBtn');
  startBtn.addEventListener('click', startQuiz);
  nameInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); startQuiz(); }
  });
  setTimeout(()=> nameInput.focus(), 50);
}

function startQuiz(){
  const nameInput = $('#name');
  const name = (nameInput.value || '').trim();
  if(!name){
    nameInput.focus();
    nameInput.style.borderColor = 'var(--danger)';
    nameInput.style.boxShadow = '0 0 0 4px rgba(220,38,38,.15)';
    return;
  }
  state.studentName = name;
  state.screen = 'quiz';
  state.current = 0;
  render();
}

/* --- Экран вопроса --- */
function renderQuiz(){
  const q = QUESTIONS[state.current];
  const total = QUESTIONS.length;
  const progress = ((state.current) / total) * 100;

  app().innerHTML = `
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <div class="brand-dot">И</div>
          <span>${escapeHtml(state.studentName)} · Рабочий лист</span>
        </div>
        <div class="progress-wrap" aria-label="Прогресс">
          <span>${state.current+1}/${total}</span>
          <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        </div>
      </div>
      <div class="card" id="qCard">
        ${renderQuestion(q)}
        <div class="btn-row">
          <button class="btn btn-ghost" id="prevBtn" ${state.current===0?'disabled':''}>← Назад</button>
          <div style="display:flex;gap:10px">
            ${!state.checked[q.id] ? `<button class="btn btn-primary" id="checkBtn" type="button">Проверить</button>` : ''}
            ${state.current < total-1
              ? `<button class="btn btn-primary" id="nextBtn" type="button">Далее →</button>`
              : `<button class="btn btn-primary" id="finishBtn" type="button">Итоги</button>`}
          </div>
        </div>
      </div>
    </div>
  `;

  attachQuestionHandlers(q);

  const prevBtn = $('#prevBtn');
  if(prevBtn && !prevBtn.disabled){

    });
  }

  if(nextBtn){
    nextBtn.addEventListener('click', () => {
      if(state.current<total-1){ state.current++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
  }
  const finishBtn = $('#finishBtn');
  if(finishBtn){
    finishBtn.addEventListener('click', () => {
      state.screen = 'result'; render(); window.scrollTo({top:0,behavior:'smooth'});
    });

/* --- Рендер разных типов вопросов --- */
function renderQuestion(q){
  const head = `
    <div class="q-head">
      <span class="q-num">${escapeHtml(q.block)} · Задание ${state.current+1}</span>
      <span class="q-type">${typeLabel(q.type)}</span>
    </div>
    <span class="chip">${escapeHtml(q.title)}</span>
    <h2>${escapeHtml(q.text)}</h2>
  `;
  let body = '';
  if(q.type === 'single') body = renderSingle(q);
  else if(q.type === 'multi') body = renderMulti(q);
  else if(q.type === 'match') body = renderMatch(q);
  else if(q.type === 'fill') body = renderFill(q);
  else if(q.type === 'tf') body = renderTF(q);
  else if(q.type === 'url') body = renderURL(q);

  const feedback = renderFeedback(q);
  return head + body + feedback;
}

function typeLabel(t){
  return ({
    single:'один ответ', multi:'несколько ответов', match:'сопоставление',
    fill:'пропуски', tf:'верно / неверно', url:'сборка адреса'
  })[t] || '';
}

function renderSingle(q){
  const cur = state.answers[q.id];
  return `<div class="options" role="radiogroup">` +
    q.options.map((opt,i)=>{
      const sel = cur === i;
      const checked = state.checked[q.id];
      let cls = 'option';
      if(sel) cls += ' selected';
      if(checked){
        if(i === q.correct) cls += ' correct';
        else if(sel) cls += ' wrong';
      }
      return `<div class="${cls}" role="radio" aria-checked="${sel}" tabindex="0" data-i="${i}">
        <span class="dot"></span>
        <span class="option-text">${escapeHtml(opt)}</span>
      </div>`;
    }).join('') + `</div>`;
}

function renderMulti(q){
  const cur = state.answers[q.id] || [];
  return `<div class="options">` +
    q.options.map((opt,i)=>{
      const sel = cur.includes(i);
      const checked = state.checked[q.id];
      let cls = 'option';
      if(sel) cls += ' selected';
      if(checked){
        const isRight = q.correct.includes(i);
        if(sel && isRight) cls += ' correct';
        else if(sel && !isRight) cls += ' wrong';
        else if(!sel && isRight) cls += ' correct';
      }
      return `<div class="${cls}" tabindex="0" data-i="${i}">
        <span class="check"></span>
        <span class="option-text">${escapeHtml(opt)}</span>
      </div>`;
    }).join('') + `</div>`;
}

function renderMatch(q){
  const ms = state.matchState[q.id] || {activeLeft:null, pairs:{}};
  const pairedRightIds = Object.values(ms.pairs);
  const checked = state.checked[q.id];

  const leftHtml = q.left.map(l => {
    const active = ms.activeLeft === l.id;
    const paired = ms.pairs[l.id];
    let cls = 'match-item';
    if(active) cls += ' active';
    if(paired) cls += ' paired';
    if(checked){
      cls += (q.pairs[l.id] === paired) ? ' correct' : ' wrong';
    }
    const pairText = paired ? q.right.find(r=>r.id===paired)?.text : '';
    return `<div class="${cls}" data-left="${l.id}" tabindex="0">
      <div>
        <div style="font-weight:600">${escapeHtml(l.text)}</div>
        ${pairText ? `<div class="muted" style="font-size:12px;margin-top:4px">→ ${escapeHtml(pairText)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  const rightHtml = q.right.map(r => {
    const used = pairedRightIds.includes(r.id);
    let cls = 'match-item';
    if(used) cls += ' paired';
    if(checked){
      const leftForRight = Object.entries(ms.pairs).find(([l,rr])=>rr===r.id);
      if(leftForRight){
        cls += (q.pairs[leftForRight[0]] === r.id) ? ' correct' : ' wrong';
      }
    }
    return `<div class="${cls}" data-right="${r.id}" tabindex="0">
      ${escapeHtml(r.text)}
    </div>`;
  }).join('');

  return `
    <div class="match-grid">
      <div class="match-col">
        <div class="muted" style="font-size:12px;margin-bottom:2px">Термин</div>
        ${leftHtml}
      </div>
      <div class="match-col">
        <div class="muted" style="font-size:12px;margin-bottom:2px">Описание</div>
        ${rightHtml}
      </div>
    </div>
    <p class="muted" style="font-size:13px;margin-top:14px">Сначала нажми на термин слева, затем на подходящее описание справа.</p>
  `;
}

function renderFill(q){
  const cur = state.answers[q.id] || {};
  const checked = state.checked[q.id];
  let blankIdx = 0;
  const html = q.segments.map(seg => {
    if(seg.t === 'text') return escapeHtml(seg.v);
    const i = blankIdx++;
    const val = cur[i] || '';
    const isCorrect = checked && norm(val) === norm(seg.a);
    const isWrong = checked && !isCorrect;
    let cls = 'blank-input';
    if(isCorrect) cls += ' correct';
    if(isWrong) cls += ' wrong';
    return `<input class="${cls}" data-blank="${i}" value="${escapeHtml(val)}" placeholder="${escapeHtml(seg.hint||'...')}" ${checked?'readonly':''}>`;
  }).join('');
  return `<div class="fill-text">${html}</div>`;
}

function renderTF(q){
  const cur = state.answers[q.id] || {};
  const checked = state.checked[q.id];
  return q.statements.map((st,i)=>{
    const val = cur[i];
    let clsTrue = 'option', clsFalse = 'option';
    if(val === true) clsTrue += ' selected';
    if(val === false) clsFalse += ' selected';
    if(checked){
      if(val === st.correct){
        if(val === true) clsTrue += ' correct'; else clsFalse += ' correct';
      } else {
        if(val === true) clsTrue += ' wrong'; else if(val === false) clsFalse += ' wrong';
      }
    }
    return `
      <div style="padding:14px;border:1px solid var(--border);border-radius:12px;margin-top:10px;background:var(--surface)">
        <div style="font-size:15px;margin-bottom:10px">${escapeHtml(st.text)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="${clsTrue}" data-st="${i}" data-val="true" style="flex:1;min-width:120px;padding:10px 14px;justify-content:center">
            <span class="dot"></span><span class="option-text">Верно</span>
          </div>
          <div class="${clsFalse}" data-st="${i}" data-val="false" style="flex:1;min-width:120px;padding:10px 14px;justify-content:center">
            <span class="dot"></span><span class="option-text">Неверно</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderURL(q){
  const cur = state.answers[q.id] || [];
  const checked = state.checked[q.id];

  const resultText = cur.length
    ? cur.map(id => q.fragments.find(f=>f.id===id).text).join('')
    : '';

  const fragmentsHtml = q.fragments.map(f => {
    const inResIdx = cur.indexOf(f.id);
    if(inResIdx >= 0){
      return `<span class="fragment in-result" data-id="${f.id}" data-pos="${inResIdx}" title="Нажми, чтобы убрать">
        <span style="opacity:.5;margin-right:6px;font-size:11px">${inResIdx+1}</span>${escapeHtml(f.text)}
      </span>`;
    }
    return `<span class="fragment" data-id="${f.id}">${escapeHtml(f.text)}</span>`;
  }).join('');

  return `
    <div class="url-builder">
      <div class="muted" style="font-size:12px;margin-bottom:6px">Получившийся адрес:</div>
      <div class="url-result ${cur.length?'':'empty'}">${cur.length ? escapeHtml(resultText) : 'Нажимай на фрагменты ниже в нужном порядке…'}</div>
      <div class="fragments">${fragmentsHtml}</div>
      ${cur.length ? `<button class="btn btn-ghost" id="clearUrl" type="button" style="margin-top:10px;padding:8px 14px;font-size:13px;min-height:36px">Очистить</button>` : ''}
      ${checked ? `<div class="url-hint">Правильная последовательность цифр: <b>${q.correct.join('')}</b></div>` : ''}
    </div>
  `;
}

function renderFeedback(q){
  const checked = state.checked[q.id];
  if(!checked) return `<div class="feedback" id="fb"></div>`;
  const ok = isCorrect(q);
  return `
    <div class="feedback show ${ok?'ok':'err'}" id="fb">
      <b>${ok?'✓ Верно!':'✗ Не совсем'}</b>
      <div style="margin-top:4px">${escapeHtml(q.explain)}</div>
    </div>
  `;
}

function isCorrect(q){
  const a = state.answers[q.id];
  if(q.type === 'single') return a === q.correct;
  if(q.type === 'multi'){
    const arr = a || [];
    return arr.length === q.correct.length && q.correct.every(i=>arr.includes(i));
  }
  if(q.type === 'match'){
    const ms = state.matchState[q.id];
    if(!ms) return false;
    return Object.keys(q.pairs).every(k => ms.pairs[k] === q.pairs[k]);
  }
  if(q.type === 'fill'){
    const cur = a || {};
    return q.segments.filter(s=>s.t==='blank').every((s,i)=> norm(cur[i]) === norm(s.a));
  }
  if(q.type === 'tf'){
    const cur = a || {};
    return q.statements.every((st,i)=> cur[i] === st.correct);
  }
  if(q.type === 'url'){
    const cur = a || [];
    return cur.length === q.correct.length && q.correct.every((v,i)=>v===cur[i]);
  }
  return false;
}

/* ============================================================
   HANDLERS
   ============================================================ */
function attachQuestionHandlers(q){
  const cb = $('#checkBtn');
  if(cb){
    cb.addEventListener('click', () => {
      if(!hasAnswer(q)){
        showInlineError('Ответь на задание, прежде чем проверять.');
        return;
      }
      state.checked[q.id] = true;
      render();
    });
  }

  if(q.type === 'single'){
    $all('.option').forEach(el=>{
      const handler = () => {
        if(state.checked[q.id]) return;
        state.answers[q.id] = parseInt(el.dataset.i,10);
        render();
      };
      el.addEventListener('click', handler);
      el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();} });
    });
  }
  else if(q.type === 'multi'){
    $all('.option').forEach(el=>{
      const handler = () => {
        if(state.checked[q.id]) return;
        const i = parseInt(el.dataset.i,10);
        const cur = state.answers[q.id] || [];
        if(cur.includes(i)) state.answers[q.id] = cur.filter(x=>x!==i);
        else state.answers[q.id] = [...cur, i];
        render();
      };
      el.addEventListener('click', handler);
      el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();} });
    });
  }
  else if(q.type === 'match'){
    if(!state.matchState[q.id]) state.matchState[q.id] = {activeLeft:null, pairs:{}};
    $all('[data-left]').forEach(el=>{
      const handler = () => {
        if(state.checked[q.id]) return;
        const ms = state.matchState[q.id];
        const lid = el.dataset.left;
        if(ms.pairs[lid]){
          delete ms.pairs[lid];
          ms.activeLeft = null;
        } else {
          ms.activeLeft = lid;
        }
        render();
      };
      el.addEventListener('click', handler);
      el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();} });
    });
    $all('[data-right]').forEach(el=>{
      const handler = () => {
        if(state.checked[q.id]) return;
        const ms = state.matchState[q.id];
        if(!ms.activeLeft){ showInlineError('Сначала выбери термин слева.'); return; }
        const rid = el.dataset.right;
        Object.keys(ms.pairs).forEach(k => { if(ms.pairs[k]===rid) delete ms.pairs[k]; });
        ms.pairs[ms.activeLeft] = rid;
        ms.activeLeft = null;
        render();
      };
      el.addEventListener('click', handler);
      el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();} });
    });
  }
  else if(q.type === 'fill'){
    $all('.blank-input').forEach(inp=>{
      inp.addEventListener('input', () => {
        if(state.checked[q.id]) return;
        const i = parseInt(inp.dataset.blank,10);
        if(!state.answers[q.id]) state.answers[q.id] = {};
        state.answers[q.id][i] = inp.value;
      });
    });
  }
  else if(q.type === 'tf'){
    $all('[data-st]').forEach(el=>{
      const handler = () => {
        if(state.checked[q.id]) return;
        const i = parseInt(el.dataset.st,10);
        const v = el.dataset.val === 'true';
        if(!state.answers[q.id]) state.answers[q.id] = {};
        state.answers[q.id][i] = v;
        render();
      };
      el.addEventListener('click', handler);
      el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();} });
    });
  }
  else if(q.type === 'url'){
    $all('.fragment').forEach(el=>{
      el.addEventListener('click', () => {
        if(state.checked[q.id]) return;
        const id = parseInt(el.dataset.id,10);
        const cur = state.answers[q.id] || [];
        if(el.classList.contains('in-result')){
          const pos = parseInt(el.dataset.pos,10);
          state.answers[q.id] = cur.slice(0, pos);
        } else if(!cur.includes(id)){
          state.answers[q.id] = [...cur, id];
        }
        render();
      });
    });
    const clr = $('#clearUrl');
    if(clr){
      clr.addEventListener('click', () => {
        if(state.checked[q.id]) return;
        state.answers[q.id] = [];
        render();
      });
    }
  }
}

function hasAnswer(q){
  const a = state.answers[q.id];
  if(q.type === 'single') return a !== undefined;
  if(q.type === 'multi') return Array.isArray(a) && a.length>0;
  if(q.type === 'match'){
    const ms = state.matchState[q.id];
    return ms && Object.keys(ms.pairs).length === q.left.length;
  }
  if(q.type === 'fill'){
    if(!a) return false;
    const blanks = q.segments.filter(s=>s.t==='blank').length;
    return Object.keys(a).length === blanks && Object.values(a).every(v => (v||'').trim()!=='');
  }
  if(q.type === 'tf'){
    if(!a) return false;
    return q.statements.every((_,i)=> a[i] !== undefined);
  }
  if(q.type === 'url') return Array.isArray(a) && a.length === q.fragments.length;
  return false;
}

function showInlineError(msg){
  const fb = $('#fb');
  if(!fb) return;
  fb.className = 'feedback show info';
  fb.textContent = msg;
  setTimeout(()=>{ if(fb.classList.contains('info')){ fb.className='feedback'; fb.textContent=''; } }, 2200);
}

/* ============================================================
   ИТОГОВЫЙ ЭКРАН
   ============================================================ */
function renderResult(){
  const total = QUESTIONS.length;
  let correctCount = 0;

    const ok = state.checked[q.id] && isCorrect(q);
    if(ok) correctCount++;
    return {q, ok};
  });
  const pct = Math.round((correctCount/total)*100);
  const circ = 2*Math.PI*68;

  let grade = '';
  if(pct >= 90) grade = 'Превосходно!';
  else if(pct >= 75) grade = 'Хороший результат';
  else if(pct >= 50) grade = 'Неплохо, но есть над чем поработать';
  else grade = 'Стоит повторить теорию';

  app().innerHTML = `
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <div class="brand-dot">И</div>
          <span>${escapeHtml(state.studentName)} · Итоги</span>
        </div>
      </div>
      <div class="card">
        <div class="score-card">
          <span class="chip">Рабочий лист завершён</span>
          <h1>${grade}</h1>
          <p class="lead">Ты прошёл все задания. Ниже — твой результат и разбор.</p>
          <div class="score-ring" aria-label="Результат ${pct} процентов">
            <svg viewBox="0 0 160 160">
              <circle class="bg" cx="80" cy="80" r="68"/>
              <circle class="fg" cx="80" cy="80" r="68"
                stroke-dasharray="${circ}"
                stroke-dashoffset="${circ}"/>
            </svg>
            <div class="label">${pct}%<small>${correctCount} из ${total}</small></div>
          </div>
          <div class="breakdown">
            <div class="stat"><div class="n" style="color:var(--success)">${correctCount}</div><div class="t">Верно</div></div>
            <div class="stat"><div class="n" style="color:var(--danger)">${total-correctCount}</div><div class="t">Ошибок</div></div>
            <div class="stat"><div class="n">${total}</div><div class="t">Всего заданий</div></div>
          </div>
        </div>

        <h3 style="margin-top:8px">Разбор по заданиям</h3>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
          ${perQuestion.map((r,i)=>`
            <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:${r.ok?'var(--success-soft)':'var(--surface-2)'}">
              <div style="width:28px;height:28px;border-radius:8px;background:${r.ok?'var(--success)':'var(--border-strong)'};color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto">
                ${r.ok?'✓':(i+1)}
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:14px">${escapeHtml(r.q.title)}</div>
                <div class="muted" style="font-size:12px">${escapeHtml(r.q.block)}</div>
              </div>
              <div style="font-size:13px;color:${r.ok?'var(--success)':'var(--text-muted)'};font-weight:600">
                ${r.ok?'Верно':'Неверно'}
              </div>
            </div>
          `).join('')}
        </div>

        <div class="btn-row" style="justify-content:center">
          <button class="btn btn-ghost" id="retryBtn" type="button">Пройти ещё раз</button>
          <button class="btn btn-primary" id="reviewBtn" type="button">Посмотреть задания</button>
        </div>
      </div>
    </div>
  `;

  requestAnimationFrame(()=>{
    const fg = document.querySelector('.score-ring .fg');
    if(fg) fg.style.strokeDashoffset = offset;
  });

  $('#retryBtn').addEventListener('click', () => {
    state.screen='start'; state.answers={}; state.checked={}; state.matchState={}; state.current=0;
    render();
  });
  $('#reviewBtn').addEventListener('click', () => {
    state.screen='quiz'; state.current=0; render();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
</body>
</html>
